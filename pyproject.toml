[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "virtuoso-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) Server for Cadence Virtuoso & Spectre"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ISDL_UG_107" }
]
keywords = ["eda", "cadence", "virtuoso", "spectre", "mcp", "llm", "analog-ic"]
dependencies = [
    "mcp[cli]>=1.0.0",
    "paramiko>=3.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
virtuoso-mcp = "virtuoso_mcp.server:main"
